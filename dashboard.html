<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Idea Validator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #151a22 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #C8F135; text-shadow: 0 0 20px rgba(200, 241, 53, 0.3); }
        .panel { background: rgba(10, 22, 40, 0.6); border: 1px solid rgba(200, 241, 53, 0.2); border-radius: 12px; padding: 25px; margin-bottom: 25px; }
        textarea { width: 100%; padding: 15px; background: rgba(0, 212, 255, 0.05); border: 1px solid rgba(0, 212, 255, 0.2); border-radius: 8px; color: #C8F135; min-height: 80px; }
        button { padding: 12px 30px; background: #C8F135; border: none; border-radius: 8px; color: #0a1628; font-weight: 600; cursor: pointer; }
        button:hover { opacity: 0.8; }
        .results { display: none; margin-top: 20px; }
        .decision-buttons { display: none; gap: 15px; margin-top: 20px; }
        .decision-buttons button { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ JARVIS - Idea Validator</h1>
        </header>

        <div class="panel">
            <h2>💡 Your Idea</h2>
            <textarea id="ideaInput" placeholder="Describe your product idea..."></textarea>
            <button id="validateBtn" onclick="validateIdea()">Validate Idea</button>
        </div>

        <div class="panel results" id="results">
            <h2>📊 Results</h2>
            <div id="resultContent"></div>
            <div class="decision-buttons" id="decisionButtons">
                <button onclick="handleDecision('BUILD')">✅ BUILD</button>
                <button onclick="handleDecision('REFINE')">🔄 REFINE</button>
                <button onclick="handleDecision('PARK')">⏸️ PARK</button>
            </div>
        </div>
    </div>

    <script>
        async function validateIdea() {
            const idea = document.getElementById('ideaInput').value.trim();
            
            if (!idea) {
                alert('Please enter an idea first');
                return;
            }

            const button = document.getElementById('validateBtn');
            button.disabled = true;
            button.textContent = 'Validating...';

            try {
                const response = await fetch('/api/validate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ idea })
                });

                const result = await response.json();

                if (!result.success) {
                    alert('Error: ' + result.error);
                    button.textContent = 'Validate Idea';
                    button.disabled = false;
                    return;
                }

                const data = result.data;

                const resultContent = `
                    <h3>Market Analysis</h3>
                    <p><strong>Market Size:</strong> ${data.market_research.market_size}</p>
                    <p><strong>Competitors:</strong> ${data.market_research.main_competitors.join(', ')}</p>
                    <p><strong>Trends:</strong> ${data.market_research.trends.join(', ')}</p>
                    <p><strong>Opportunity Score:</strong> ${data.market_research.opportunity_score}/10</p>
                    
                    <h3 style="margin-top: 20px;">Product Specification</h3>
                    <p><strong>Title:</strong> ${data.prd.title}</p>
                    <p><strong>Problem:</strong> ${data.prd.problem_statement}</p>
                    <p><strong>Solution:</strong> ${data.prd.solution}</p>
                    <p><strong>Target Users:</strong> ${data.prd.target_users.join(', ')}</p>
                    <p><strong>Features:</strong> ${data.prd.key_features.map(f => f.name).join(', ')}</p>
                    <p><strong>Success Metrics:</strong> ${data.prd.success_metrics.join(', ')}</p>
                    <p><strong>Timeline:</strong> ${data.prd.estimated_launch_timeline}</p>
                `;

                document.getElementById('resultContent').innerHTML = resultContent;
                document.getElementById('results').style.display = 'block';
                document.getElementById('decisionButtons').style.display = 'flex';

            } catch (error) {
                alert('Connection error: ' + error.message);
            } finally {
                button.disabled = false;
                button.textContent = 'Validate Idea';
            }
        }

        function handleDecision(decision) {
            alert('Decision: ' + decision + ' - Ready for next steps!');
        }
    </script>
</body>
</html>
